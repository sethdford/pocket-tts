[project]
name = "pocket-voice"
requires-python = ">= 3.10,<3.15"
description = "Real-time voice AI on Apple Silicon. Native C/Rust pipeline: Mic → STT → LLM → TTS → Speaker."
version = "3.0.0"
readme = "README.md"
dependencies = [
    "numpy>=2",
    "mlx>=0.30.0",
    "pydantic>=2",
    "sentencepiece>=0.2.0",
    "beartype>=0.22.5",
    "safetensors>=0.4.0",
    "typer>=0.10.0",
    "typing_extensions>=4.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.13.0",
    "python-multipart>=0.0.21",
    "scipy>=1.5.0",
    "huggingface_hub>=0.10",
    "requests>=2.20.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12.0"]
voice = [
    "sounddevice>=0.5.0",
    "claude-agent-sdk>=0.1.37",
    "moshi>=0.2.9",
]


[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "line-profiler>=5.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-autolinks-plugin>=0.7.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "soundfile",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"
# avoid having a trailing comma changing
# the behavior of the formatter
skip-magic-trailing-comma = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_tts"]

[project.scripts]
pocket-voice = "pocket_tts.main:cli_app"
pocket-tts = "pocket_tts.main:cli_app"  # Backwards-compatible alias

[tool.uv]
# System python distribution can have header files missing, so we use only the python
# distributions provided by uv which have everything included.
python-preference = "only-managed"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
